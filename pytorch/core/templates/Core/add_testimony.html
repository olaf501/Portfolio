<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Leave Feedback | Engineering Portfolio</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #f8fafc; padding: 2rem; }
        .card { max-width: 600px; margin: 0 auto; background: #1e293b; padding: 2rem; border-radius: 8px; }
        h2 { color: #38bdf8; margin-top: 0; }
        .form-input { width: 100%; padding: 0.6rem; border-radius: 4px; border: 1px solid #334155; background: #0f172a; color: #fff; box-sizing: border-box; margin-bottom: 1rem; }
        .btn { background: #38bdf8; color: #0f172a; padding: 0.7rem 1.5rem; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Leave a Testimony</h2>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn">Submit Feedback</button>
            <a href="{% url 'testimony_list' %}" class="btn" style="background:#475569; color:#fff; margin-left: 0.5rem;">View All Testimonies</a>
        </form>
    </div>
</body>
</html>
