<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Me | Engineering Portfolio</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #f8fafc; padding: 2rem; }
        .card { max-width: 650px; margin: 0 auto; background: #1e293b; padding: 2rem; border-radius: 8px; }
        h2 { color: #38bdf8; margin-top: 0; }
        .form-input { width: 100%; padding: 0.6rem; border-radius: 4px; border: 1px solid #334155; background: #0f172a; color: #fff; box-sizing: border-box; margin-bottom: 1rem; }
        .btn { background: #38bdf8; color: #0f172a; padding: 0.7rem 1.5rem; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; text-decoration: none; }
        .alert { background: #10b981; color: #fff; padding: 0.8rem; border-radius: 4px; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Inquire / Contact Services</h2>
        {% if success %}
            <div class="alert">Your message has been sent successfully!</div>
        {% endif %}
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn">Send Inquiry</button>
            <a href="{% url 'project_list' %}" class="btn" style="background:#475569; color:#fff; margin-left: 0.5rem;">Back to Home</a>
        </form>
    </div>
</body>
</html>
