<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Tech Stack | Dashboard</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .form-card {
            background: #1e293b;
            padding: 2.5rem;
            border-radius: 12px;
            border: 1px solid #334155;
            width: 100%;
            max-width: 450px;
        }
        h2 { margin-top: 0; color: #38bdf8; }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; color: #94a3b8; }
        input[type="text"] {
            width: 100%;
            padding: 0.75rem;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 0.8rem;
            background: #0284c7;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { background: #0369a1; }
        .back-link { display: inline-block; margin-top: 1rem; color: #94a3b8; text-decoration: none; font-size: 0.9rem; }
        .back-link:hover { color: #38bdf8; }
    </style>
</head>
<body>
    <div class="form-card">
        <h2>Add Tech Stack</h2>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_name">Tech Stack Name</label>
                {{ form.name }}
            </div>
            <button type="submit">Save Tech Stack</button>
        </form>
        <a href="{% url 'dashboard' %}" class="back-link">&larr; Back to Dashboard</a>
    </div>
</body>
</html>
