<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Delete | Portfolio Admin</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e293b;
            padding: 2.5rem;
            border-radius: 12px;
            border: 1px solid #334155;
            text-align: center;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        h2 { color: #f87171; margin-top: 0; }
        p { color: #94a3b8; font-size: 1rem; margin-bottom: 2rem; }
        .actions { display: flex; justify-content: center; gap: 1rem; align-items: center; }
        .btn-danger {
            background: #ef4444;
            color: white;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }
        .btn-danger:hover { background: #dc2626; }
        .btn-cancel {
            background: #334155;
            color: #e2e8f0;
            padding: 0.75rem 1.5rem;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .btn-cancel:hover { background: #475569; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Confirm Deletion</h2>
        <p>Are you sure you want to delete this {{ type }}: <br><strong style="color: #ffffff;">"{{ object }}"</strong>?</p>
        <form method="post">
            {% csrf_token %}
            <div class="actions">
                <button type="submit" class="btn-danger">Yes, Delete</button>
                <a href="{% url 'dashboard' %}" class="btn-cancel">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
